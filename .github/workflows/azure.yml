name: Deploy recognize_cctv to Azure

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: azure
        type: string
  push:
    branches:
      - azure

concurrency:
  group: recognize-cctv-azure-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
      APP_DIR: ${{ secrets.AZURE_APP_DIR || '/home/apps/machine-learning/recognize_cctv' }}

    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Check SSH port
        run: |
          timeout 15 bash -c "</dev/tcp/${{ secrets.AZURE_HOST }}/22"

      - name: Copy source to Azure
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: ".,!node_modules,!venv,!.venv,!logs,!vector_db,!face_datasets"
          target: ${{ secrets.AZURE_APP_DIR || '/home/apps/machine-learning/recognize_cctv' }}
          overwrite: true
          rm: false

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          command_timeout: 30m
          envs: DEPLOY_BRANCH,APP_DIR
          script: |
            set -Eeuo pipefail

            cd "$APP_DIR"
            test -f environment/.env.staging

            echo "Deploying branch: $DEPLOY_BRANCH"

            docker compose --env-file environment/.env.staging build --pull recognize_cctv
            docker compose --env-file environment/.env.staging run --rm recognize_cctv alembic upgrade heads
            docker compose --env-file environment/.env.staging up -d --remove-orphans
            docker compose ps

            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error --max-time 10 \
                http://127.0.0.1:8004/api/v1/cctv/health; then
                echo "Azure deployment completed."
                exit 0
              fi
              echo "Waiting for backend health ($attempt/20)..."
              sleep 5
            done

            docker compose logs --tail=100 recognize_cctv
            exit 1
